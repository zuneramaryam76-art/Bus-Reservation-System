<!doctype html>
<html>
<head>
  <title>Update Bus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="update">

  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="list.html">List Buses</a>
    <a href="listOne.html">Find Bus</a>
    <a href="insert.html">Add Bus</a>
    <a class="active" href="update.html">Update Bus</a>
    <a href="delete.html">Delete Bus</a>
  </nav>

  <main class="container">
    <section class="hero">
      <h1>Update Bus</h1>
      <p>Choose a bus from the database before editing it.</p>
    </section>
    

    <section class="card">
      <label>Bus</label>
      <select id="bus-select">
        <option>Loading buses…</option>
      </select>

      <form id="bus-form" hidden>
        <div id="edit-fields">
          <label>Source</label>
          <input id="source" required>

          <label>Destination</label>
          <input id="destination" required>

          <label>Time of Departure</label>
          <input id="departure" type="time" required>

          <label>Total Number of Seats</label>
          <input id="seats" type="number" min="1" required>

          <button type="submit">Update Bus</button>
        </div>
      </form>

      <p id="status"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
